version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: skill-testing-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: module2
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/prisma/populate_db.sql:/docker-entrypoint-initdb.d/init.sql

  server:
    build: ./server
    container_name: skill-testing-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/module2
      - PORT=5000
    depends_on:
      - db

  client:
    build: ./client
    container_name: skill-testing-client
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - server

volumes:
  pgdata:
